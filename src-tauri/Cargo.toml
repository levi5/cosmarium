[package]
name = "cosmarium"
version = "0.1.0"
description = "A focused desktop file manager"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
trash = "5"
notify = "6"
notify-debouncer-full = "0.3"
tauri = { version = "2", features = ["protocol-asset"] }
